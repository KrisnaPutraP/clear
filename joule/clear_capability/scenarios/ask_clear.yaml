description: >-
  Inbound shipment exceptions handled by CLEAR. Call this whenever the user reports, starts, or asks
  about a held, delayed, or congested import shipment or a logistics event (for example "work
  S1-DOC-HOLD" or "SHP-1002 is stuck at the port"); asks for the status, plan, evidence, or options of
  a case or shipment (for example "status of SHP-1001" or "why not transfer everything?"); asks what
  needs their decision or what is pending; or approves, rejects, holds, confirms, or cancels a decision
  on a stock transfer, in any wording or language (for example "approve VAL-0002", "do not approve
  yet", "jangan approve dulu", "Confirm approval of VAL-0002, code K7Q2", "Cancel, keep VAL-0002
  waiting", or "reject VAL-0002 because the plant needs the stock"); or asks what CLEAR can do.

target:
  type: function
  name: ask_clear
