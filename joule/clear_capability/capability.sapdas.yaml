schema_version: 3.27.0  # The first version with agent-request.

metadata:
  namespace: joule.ext  # Capabilities outside joule.ext count as SAP content and fail to deploy.
  name: cookusan_clear
  version: 1.0.1
  display_name: CLEAR shipment exceptions
  description: >-
    Connects CLEAR, the cross-border supply chain exception resolution agent, to Joule over A2A:
    work a shipment exception, read a case's status and recovery plan, and approve or reject a
    validated stock transport order.

system_aliases:
  CLEAR_AGENT:
    destination: COOKUSAN_CLEAR_AGENT  # BTP destination to the A2A server (scripts/run_joule_agent.py).
